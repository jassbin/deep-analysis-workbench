<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>案例库 · 推理轨迹卡</title>
<link rel="stylesheet" href="css/style.css">
<style>
.cases-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(380px,1fr)); gap:16px; padding:16px; max-width:1400px; margin:0 auto}
.trace-card{background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden}
.trace-head{padding:14px 16px; border-bottom:1px solid var(--line); background:var(--panel2)}
.trace-head .id{font-size:11px; color:var(--accent); font-weight:700}
.trace-head h2{font-size:16px; margin:2px 0 4px}
.trace-head .meta{color:var(--dim); font-size:12px}
.trace-body{padding:14px 16px; max-height:70vh; overflow-y:auto}
.trace-body h4{font-size:12px; color:var(--gold); margin:14px 0 6px; border-bottom:1px dashed var(--line); padding-bottom:3px}
.trace-body h4:first-child{margin-top:0}
.trace-body .hint{font-size:12px}
.trace-body ul{list-style:none}
.trace-body li{font-size:13px; margin:6px 0; padding-left:10px; border-left:2px solid var(--line)}
.trace-body li b{color:var(--txt)}
.status-pill{display:inline-block; font-size:11px; padding:1px 8px; border-radius:10px; background:#123c2a; color:var(--ok); margin-left:6px}
.trace-body .card{margin:6px 0}
@media (max-width:720px){
  .cases-grid{grid-template-columns:1fr; padding:12px}
  .trace-body{max-height:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">深度分析工作台 <span class="tag">MVP</span></div>
  <div class="project-name">案例库 · 推理轨迹卡（v2）</div>
  <nav class="topnav">
    <a href="index.html">工作台</a>
    <a class="active" href="cases.html">案例库</a>
  </nav>
</header>

<div class="pane-title" style="padding:16px 16px 0; max-width:1400px; margin:0 auto">案例库 = 大师棋谱：入库单位是「推理轨迹」而不是结论。看异常为什么是它、撕裂怎么走、游走为什么去那里、在哪碰过壁。</div>
<main class="cases-grid" id="casesGrid"></main>

<script src="js/data.js"></script>
<script>
(function () {
  "use strict";
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");}
  var grid = document.getElementById("casesGrid");
  grid.innerHTML = CASES.map(function (c) {
    return '<article class="trace-card">' +
      '<div class="trace-head"><span class="id">' + c.id + ' · 推理轨迹卡</span><h2>' + esc(c.title) + '</h2>' +
      '<span class="meta">' + esc(c.field) + ' ｜ ' + c.rounds + ' 轮对话' + '</span><span class="status-pill">' + esc(c.status) + '</span></div>' +
      '<div class="trace-body">' +
      '<h4>起点 · 材料与预期基线</h4><div class="card"><div class="hint">材料：' + esc(c.start.material) + '</div><div class="hint" style="margin-top:4px">基线：' + esc(c.start.baseline) + '</div></div>' +
      '<h4>异常候选与淘汰</h4><ul>' + c.anomalies.map(function (a) { return '<li><b>' + esc(a.cand) + '</b><br><span class="hint">' + esc(a.why) + '</span></li>'; }).join("") + '</ul>' +
      '<h4>撕裂路径（每步显式理由）</h4><ul>' + c.tear.map(function (t) { return '<li><b>' + esc(t.action) + '</b> · 张力：' + esc(t.tension) + '<br><span class="hint">为什么：' + esc(t.why) + '</span></li>'; }).join("") + '</ul>' +
      '<h4>游走轨迹</h4><ul>' + c.wander.map(function (w) { return '<li><b>' + esc(w.to) + '</b><br><span class="hint">带回：' + esc(w.brought) + '</span><br><span class="hint">修正：' + esc(w.corrected) + '</span></li>'; }).join("") + '</ul>' +
      '<h4>碰壁记录（反例/质询命中）</h4><ul>' + c.bumps.map(function (b) { return '<li><b>' + esc(b.what) + '</b><br><span class="hint">影响：' + esc(b.effect) + '</span></li>'; }).join("") + '</ul>' +
      '<h4>结论 · 置信度 · 可证伪条件</h4><ul>' + c.conclusion.map(function (cc) { return '<li><b>' + esc(cc.claim) + '</b> ｜ 置信度 ' + cc.conf + '%<br><span class="hint">可证伪：' + esc(cc.falsifiable) + '</span></li>'; }).join("") + '</ul>' +
      '</div></article>';
  }).join("");
})();
</script>
</body>
</html>
